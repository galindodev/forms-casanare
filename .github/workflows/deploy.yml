name: Deploy Backend to Lambda

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests (if any)
        working-directory: backend
        run: npm run typecheck

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Clean up failed CloudFormation stack
        run: |
          # Delete failed stack if it exists
          aws cloudformation delete-stack --stack-name defensores-casanare-api-dev --region us-east-1 2>/dev/null || true
          # Wait for deletion to complete
          aws cloudformation wait stack-delete-complete --stack-name defensores-casanare-api-dev --region us-east-1 2>/dev/null || true
        continue-on-error: true

      - name: Deploy to Lambda
        working-directory: backend
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            npm run deploy:prod
          else
            npm run deploy:dev
          fi
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Deployment notification
        if: success()
        run: echo "✓ Backend deployed successfully to Lambda"
