service: defensores-casanare-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  memorySize: 512
  timeout: 30
  deploymentBucket:
    name: defensores-casanare-deployment-bucket
    serverSideEncryption: AES256
  environment:
    DB_HOST: ${env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_NAME: ${env:DB_NAME}
    DB_PORT: ${env:DB_PORT}
    JWT_SECRET: ${env:JWT_SECRET}
    NODE_ENV: production

package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!.env*'

functions:
  api:
    handler: dist/handler.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

plugins:
  # - serverless-offline
  - serverless-plugin-tracing

custom:
  serverless-offline:
    httpPort: 3000
 
  